# Sert uniquement l'application Angular (fichiers statiques).
# L'API (api.senlab.site) et le service IA (ia.senlab.site) ont leur propre
# sous-domaine : le frontend les appelle directement (CORS côté serveurs).
# Le HTTPS est géré en amont par le Nginx du serveur (Certbot).

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers générés par Angular (dont les polices primeicons dans
    # /media/) : leur nom contient un hash, ils peuvent être mis en cache
    # très longtemps.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|webp|ico|mp4)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Routes Angular (/reservations/ajouter...) : renvoyées vers index.html,
    # jamais mis en cache pour récupérer immédiatement une nouvelle version.
    location / {
        try_files $uri $uri/ /index.html;
        # Un add_header dans une location annule ceux du bloc server :
        # les en-têtes de sécurité sont donc répétés pour index.html.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
