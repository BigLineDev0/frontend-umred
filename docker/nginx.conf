# Un seul point d'entrée pour toute la plateforme :
#   /          -> application Angular (fichiers statiques)
#   /api/      -> Django (API REST)
#   /admin/, /static/, /media/ -> Django (admin, ses fichiers, fichiers envoyés)
#   /ia/       -> service IA FastAPI (le préfixe /ia est retiré)
# Même origine pour tout : pas de CORS, pas d'adresse de serveur dans le build.

upstream backend { server backend:8000; }
upstream ia { server ia:8001; }

server {
    listen 80;
    server_name _;

    # Manuels PDF (10 Mo max côté Django) et photos.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # En-têtes transmis à Django et au service IA (hérités par les locations).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    root /usr/share/nginx/html;
    index index.html;

    # « ^~ » : ces préfixes passent AVANT les expressions régulières
    # ci-dessous. Sans cela, /media/photo.png ou /static/admin/x.css
    # seraient cherchés dans les fichiers Angular (404).
    location ^~ /api/    { proxy_pass http://backend; proxy_read_timeout 180s; }
    location ^~ /admin/  { proxy_pass http://backend; }
    location ^~ /static/ { proxy_pass http://backend; }
    # /media/ sert deux choses : les polices compilées par Angular
    # (primeicons-*.woff2...) et les fichiers envoyés par les utilisateurs
    # (photos, manuels PDF, logos), stockés par Django. On cherche d'abord
    # le fichier Angular, sinon on relaie vers Django.
    location ^~ /media/  { try_files $uri @django; expires 30d; }
    location @django     { proxy_pass http://backend; }

    # Le préfixe /ia est retiré : /ia/api/chat -> service IA /api/chat.
    # L'inférence du modèle sur CPU peut prendre du temps.
    location ^~ /ia/     { proxy_pass http://ia/; proxy_read_timeout 300s; }

    # Fichiers générés par Angular : leur nom contient un hash, ils peuvent
    # être mis en cache très longtemps.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|webp|ico|mp4)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Routes Angular (/reservations/ajouter...) : renvoyées vers index.html,
    # jamais mis en cache pour récupérer immédiatement une nouvelle version.
    location / {
        try_files $uri $uri/ /index.html;
        # Un add_header dans une location annule ceux du bloc server :
        # les en-têtes de sécurité sont donc répétés pour index.html.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
