<app-site-header />

<main class="relative isolate overflow-hidden pt-32 pb-24 px-5 sm:px-8 min-h-[calc(100vh-4rem)] flex items-center">
  <!-- Halo discret en fond, dans les couleurs de la charte -->
  <div class="absolute left-1/2 top-1/3 -z-10 h-[420px] w-[420px] -translate-x-1/2 rounded-full bg-primary-light/20 blur-3xl"></div>

  <div class="max-w-2xl mx-auto text-center">
    <p class="hero-in text-[7rem] sm:text-[8rem] font-bold leading-none tracking-tight bg-linear-to-br from-primary-light via-primary to-navy bg-clip-text text-transparent select-none"
       aria-hidden="true">404</p>

    <h1 class="hero-in mt-4 text-3xl sm:text-4xl font-bold text-text" style="animation-delay:.1s">Page introuvable</h1>

    <p class="hero-in mt-4 text-base text-text-secondary leading-relaxed" style="animation-delay:.2s">
      La page que vous cherchez n'existe pas, a été déplacée ou n'est plus disponible.
    </p>

    @if (urlDemandee) {
      <p class="hero-in mt-3 inline-flex max-w-full items-center gap-2 rounded-lg bg-background border border-border px-3 py-1.5 text-xs text-text-secondary"
         style="animation-delay:.25s">
        <i class="pi pi-link text-[10px]"></i>
        <code class="truncate">{{ urlDemandee }}</code>
      </p>
    }

    <div class="hero-in mt-8 flex flex-col sm:flex-row items-center justify-center gap-3" style="animation-delay:.3s">
      <p-button [label]="estConnecte() ? 'Retour à mon espace' : 'Retour à l\'accueil'"
        [icon]="estConnecte() ? 'pi pi-th-large' : 'pi pi-home'" [routerLink]="routeRetour()" />
      <p-button label="Page précédente" icon="pi pi-arrow-left" severity="secondary" [outlined]="true"
        (onClick)="pagePrecedente()" />
    </div>

    <!-- Raccourcis : l'utilisateur repart vers une page utile au lieu d'abandonner -->
    <div class="hero-in mt-12 pt-8 border-t border-border" style="animation-delay:.4s">
      <p class="text-xs font-medium uppercase tracking-wide text-text-secondary mb-4">Pages utiles</p>
      <div class="flex flex-wrap justify-center gap-2">
        @for (lien of liensUtiles; track lien.route) {
          <a [routerLink]="lien.route"
             class="inline-flex items-center gap-2 rounded-lg border border-border bg-white px-4 py-2 text-sm text-text transition-colors hover:border-primary/40 hover:text-primary">
            <i [class]="lien.icon + ' text-xs'"></i>
            {{ lien.label }}
          </a>
        }
      </div>
    </div>
  </div>
</main>

<app-site-footer />
