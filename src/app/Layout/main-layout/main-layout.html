<div class="flex h-screen overflow-hidden bg-background">

  <!-- Sidebar -->
  <app-sidebar />

  <!-- Zone principale -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Topbar -->
    <app-topbar />

    <!-- Sur téléphone, les toasts (25rem par défaut) dépassaient de l'écran. -->
    <p-toast position="top-right" [breakpoints]="{ '640px': { width: 'calc(100vw - 1rem)', right: '0.5rem', left: '0.5rem' } }" />
    <!-- Contenu -->
    <main class="flex-1 overflow-y-auto bg-background p-4 sm:p-5 lg:p-6">
      <router-outlet />

      <app-footer-dahsboard />
    </main>
    <app-assistant-chat-app />

  </div>

</div>
