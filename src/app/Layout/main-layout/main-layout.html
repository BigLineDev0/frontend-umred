<div class="flex h-[100dvh] overflow-hidden bg-background">

  <!-- Sidebar -->
  <app-sidebar />

  <!-- Zone principale -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Topbar -->
    <app-topbar />

    <!-- Sur téléphone, les toasts (25rem par défaut) dépassaient de l'écran. -->
    <p-toast position="top-right" [breakpoints]="{ '640px': { width: 'calc(100vw - 1rem)', right: '0.5rem', left: '0.5rem' } }" />

    <!-- Contenu : le wrapper fait au moins toute la hauteur, le contenu
         pousse (flex-1) et le pied de page reste collé en bas (mt-auto),
         sans recouvrir le contenu quand il est long. -->
    <main class="flex-1 overflow-y-auto bg-background">
      <div class="flex min-h-full flex-col p-4 sm:p-5 lg:p-6">
        <div class="flex-1">
          <router-outlet />
        </div>
        <app-footer-dahsboard class="mt-auto block" />
      </div>
    </main>
    <app-assistant-chat-app />

  </div>

</div>
