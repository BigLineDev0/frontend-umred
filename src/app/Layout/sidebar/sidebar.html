<!-- Overlay mobile -->
@if (layoutService.sidebarOpen()) {
  <div class="fixed inset-0 bg-black/40 z-40 lg:hidden" (click)="closeSidebar()"></div>
}

<aside
  class="fixed lg:static inset-y-0 left-0 z-50 w-64 h-screen flex flex-col bg-sidebar text-white shrink-0 transform transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0 overflow-hidden"
  [class.translate-x-0]="layoutService.sidebarOpen()">

  <!-- Logo -->
  <div class="px-4 py-4 shrink-0">
    <a routerLink="/" (click)="closeSidebar()"
       title="Aller au site vitrine UMRED"
       class="group block rounded-md bg-white px-3 py-2.5 shadow-sm ring-1 ring-white/10 transition duration-200 hover:ring-white/40 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">
      <img [src]="logo()"
           [alt]="nomEtablissement() + ', retour au site vitrine'"
           class="w-full h-auto max-h-16 object-contain transition-transform duration-200 group-hover:scale-[1.02]" />
    </a>
  </div>

  <div class="border-t border-sidebar-border"></div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto px-3 py-4">
    <p class="px-3 text-[11px] font-medium tracking-wide text-white/40 mb-2">MENU</p>

    <ul class="space-y-1">
      @for (item of navItems(); track item.route) {
        <li>
          @if (item.disabled) {
            <span
              class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white/30 cursor-not-allowed"
              title="Bientôt disponible"
            >
              <i [class]="item.icon"></i>
              <span class="flex-1">{{ item.label }}</span>
              <span class="text-[9px] uppercase bg-white/10 px-1.5 py-0.5 rounded">Bientôt</span>
            </span>
          } @else {

            <a
               [routerLink]="item.route"
              [class.sidebar-link-active]="isItemActive(item)"
                (click)="closeSidebar()"
                class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white/70 hover:bg-white/5 hover:text-white transition-colors"
              >
                <i [class]="item.icon"></i>
                <span>{{ item.label }}</span>
              </a>
          }
        </li>
      }
    </ul>
  </nav>

  <div class="border-t border-sidebar-border"></div>

  <!-- Profil -->
  <div class="flex items-center gap-3 px-4 py-4 shrink-0">
    <p-avatar [label]="initials()" shape="circle" styleClass="!bg-white/10 !text-white shrink-0" />

    <div class="flex-1 min-w-0">
      <p class="text-sm font-medium truncate">{{ user()?.prenom }} {{ user()?.nom }}</p>
      <p class="text-xs text-white/50 truncate">{{ roleLabel() }}</p>
    </div>

    <button
      type="button"
      (click)="onLogout()"
      class="text-white/50 hover:text-white transition-colors"
      title="Déconnexion">
      <i class="pi pi-sign-out"></i>
    </button>
  </div>
</aside>
