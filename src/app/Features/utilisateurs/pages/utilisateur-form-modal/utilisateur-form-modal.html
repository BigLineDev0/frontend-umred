<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" [resizable]="false"
  [style]="{ width: '480px', maxWidth: 'calc(100vw - 2rem)' }"
  [header]="isEditMode ? 'Modifier l\'utilisateur' : 'Nouvel utilisateur'">

  <div class="space-y-5">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-text mb-2">Prénom <span class="text-danger">*</span></label>
        <input pInputText type="text" [(ngModel)]="form.prenom" placeholder="Fatou" class="w-full" />
      </div>
      <div>
        <label class="block text-sm font-medium text-text mb-2">Nom <span class="text-danger">*</span></label>
        <input pInputText type="text" [(ngModel)]="form.nom" placeholder="Ndiaye" class="w-full" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-text mb-2">Email <span class="text-danger">*</span></label>
      <input pInputText type="email" [(ngModel)]="form.email" placeholder="fatou.ndiaye@umred.sn" class="w-full" />
    </div>
    <div>
      <label class="block text-sm font-medium text-text mb-2">Rôle <span class="text-danger">*</span></label>
      <p-select [options]="roleOptions" optionLabel="label" optionValue="value" [(ngModel)]="form.role" appendTo="body" class="w-full" />
    </div>

    @if (form.role === 'CHERCHEUR') {
    <div>
      <label class="block text-sm font-medium text-text mb-2">Statut académique</label>
      <p-select [options]="statutAcademiqueOptions" optionLabel="label" optionValue="value" [(ngModel)]="form.statut_academique"
        placeholder="Non renseigné" [showClear]="true" appendTo="body" class="w-full" />
      <small class="mt-1 block text-xs text-text-secondary">Départage les demandes concurrentes à priorité de projet égale.</small>
    </div>
    }

    @if (form.role === 'ETUDIANT') {
    <div>
      <label class="block text-sm font-medium text-text mb-2">Encadrant</label>
      <p-select [options]="encadrants()" optionLabel="nom_complet" optionValue="id" [(ngModel)]="form.encadrant"
        placeholder="Aucun encadrant" [showClear]="true" [filter]="true" filterBy="nom_complet" appendTo="body" class="w-full" />
      <small class="mt-1 block text-xs text-text-secondary">
        L'encadrant reçoit et valide en priorité les demandes de réservation de l'étudiant.
      </small>
    </div>
    }

    <div>
      <label class="block text-sm font-medium text-text mb-2">Téléphone</label>
      <input pInputText type="tel" [(ngModel)]="form.telephone" placeholder="+221 77 000 00 00" class="w-full" />
    </div>


  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3">
      <p-button label="Annuler" severity="secondary" [outlined]="true" [disabled]="submitting()" (onClick)="onAnnuler()" />
      <p-button [label]="isEditMode ? 'Enregistrer' : 'Ajouter'" icon="pi pi-check" [loading]="submitting()" (onClick)="onValider()" />
    </div>
  </ng-template>
</p-dialog>
