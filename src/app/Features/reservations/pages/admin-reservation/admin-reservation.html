<div class="mx-auto max-w-[1400px]">
  <div class="mb-7">
    <div class="mb-4 flex items-center gap-2 text-sm text-text-secondary">
      <a routerLink="/" class="transition-colors hover:text-primary">Accueil</a>
      <i class="pi pi-angle-right text-xs"></i>
      <span class="font-medium text-primary">Réservations</span>
    </div>
    <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-text">Réservations</h1>
        <p class="mt-1 text-sm text-text-secondary">
          Consultez, gérez et suivez les réservations des laboratoires et des équipements.
        </p>
      </div>
      <p-button
        label="Créer une réservation"
        icon="pi pi-plus"
        routerLink="/reservations/nouvelle"
      />
    </div>
  </div>

  <app-reservation-stats
    class="mb-6 block"
    [total]="totalReservations()"
    [enAttente]="reservationsEnAttente()"
    [validees]="reservationsValidees()"
    [dernier]="reservationsTerminees()"
  />

  <div class="mb-6 rounded-xl border border-border bg-white p-4 sm:p-5">
    <app-reservation-filters [(filters)]="filters" />
  </div>

  @if (loading()) {
    <div class="rounded-xl border border-border bg-white p-12 text-center">
      <i class="pi pi-spin pi-spinner text-2xl text-primary"></i>
      <p class="mt-3 text-sm text-text-secondary">Chargement des réservations...</p>
    </div>
  } @else if (error()) {
    <div class="rounded-xl border border-border bg-white p-10 text-center">
      <i class="pi pi-exclamation-circle text-3xl text-danger"></i>
      <p class="mt-3 text-sm font-medium text-text">Impossible de charger les réservations</p>
      <p class="mt-1 text-sm text-text-secondary">{{ error() }}</p>
      <p-button
        label="Réessayer"
        icon="pi pi-refresh"
        [outlined]="true"
        size="small"
        class="mt-4"
        (onClick)="reservationService.loadReservations()"
      />
    </div>
  } @else {
    <div class="rounded-xl border border-border bg-white">
      <app-reservation-table
        [reservations]="filteredReservations()"
        [showUtilisateur]="true"
        (view)="voirReservation($event)"
        (edit)="modifierReservation($event)"
        (cancel)="annulerReservation($event)"
      />
      <app-reservation-card
        [reservations]="filteredReservations()"
        [showUtilisateur]="true"
        (view)="voirReservation($event)"
        (edit)="modifierReservation($event)"
        (cancel)="annulerReservation($event)"
      />
    </div>
  }
</div>
