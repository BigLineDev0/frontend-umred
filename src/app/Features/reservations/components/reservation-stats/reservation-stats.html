<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
  <div class="rounded-xl border border-border bg-white p-5">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm text-text-secondary">{{ labels().total }}</p>
        <p class="mt-1 text-3xl font-bold text-text">{{ total() }}</p>
      </div>
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-primary/10">
        <i class="pi pi-calendar text-lg text-primary"></i>
      </div>
    </div>
  </div>

  <div class="rounded-xl border border-border bg-white p-5">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm text-text-secondary">{{ labels().enAttente }}</p>
        <p class="mt-1 text-3xl font-bold text-text">{{ enAttente() }}</p>
      </div>
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-accent/10">
        <i class="pi pi-hourglass text-lg text-accent"></i>
      </div>
    </div>
  </div>

  <div class="rounded-xl border border-border bg-white p-5">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm text-text-secondary">{{ labels().validees }}</p>
        <p class="mt-1 text-3xl font-bold text-text">{{ validees() }}</p>
      </div>
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-success/10">
        <i class="pi pi-check-circle text-lg text-success"></i>
      </div>
    </div>
  </div>

  <div class="rounded-xl border border-border bg-white p-5">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-sm text-text-secondary">{{ labels().dernier }}</p>
        <p class="mt-1 text-3xl font-bold text-text">{{ dernier() }}</p>
      </div>
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-secondary/10">
        <i class="pi pi-flag text-lg text-secondary"></i>
      </div>
    </div>
  </div>
</div>
