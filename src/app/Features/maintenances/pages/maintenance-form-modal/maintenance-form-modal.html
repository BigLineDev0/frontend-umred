<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" [resizable]="false"
  [style]="{ width: '480px', maxWidth: 'calc(100vw - 2rem)' }" header="Nouvelle maintenance">

  <div class="space-y-5">
    <div>
      <label class="block text-sm font-medium text-text mb-2">Type <span class="text-danger">*</span></label>
      <p-select [options]="typeOptions" optionLabel="label" optionValue="value"
        [(ngModel)]="form.type" (onChange)="onTypeChange()" class="w-full" />
    </div>

    <div>
      <label class="block text-sm font-medium text-text mb-2">Équipement <span class="text-danger">*</span></label>
      <p-select [options]="equipementOptions" optionLabel="label" optionValue="value"
        [(ngModel)]="form.equipement" placeholder="Sélectionnez un équipement" class="w-full" [showClear]="true" />
      @if (form.type === 'CORRECTIVE' && equipementOptions.length === 0) {
        <small class="text-text-secondary text-xs mt-1 block">Aucun équipement en panne pour le moment.</small>
      }
    </div>

    <div>
      <label class="block text-sm font-medium text-text mb-2">Date planifiée <span class="text-danger">*</span></label>
      <p-datepicker [(ngModel)]="form.datePlanifiee" dateFormat="dd/mm/yy" placeholder="jj/mm/aaaa"
        [showIcon]="true" [showTime]="true" class="w-full" inputStyleClass="w-full" />
    </div>

    <div>
      <label class="block text-sm font-medium text-text mb-2">Description <span class="text-danger">*</span></label>
      <textarea pTextarea rows="3" [(ngModel)]="form.description"
        placeholder="Détail de l'intervention à réaliser..." class="w-full"></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3">
      <p-button label="Annuler" severity="secondary" [outlined]="true" [disabled]="submitting()" (onClick)="onAnnuler()" />
      <p-button label="Planifier" icon="pi pi-check" [loading]="submitting()" (onClick)="onPlanifier()" />
    </div>
  </ng-template>
</p-dialog>
