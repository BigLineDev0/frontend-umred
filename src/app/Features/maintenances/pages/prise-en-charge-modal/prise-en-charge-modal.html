<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" [resizable]="false"
  [style]="{ width: '420px', maxWidth: 'calc(100vw - 2rem)' }" header="Prendre en charge la panne">

  @if (maintenance(); as m) {
    <div class="bg-background rounded-lg p-4 mb-5 space-y-2">
      <div class="flex justify-between text-sm">
        <span class="text-text-secondary">Équipement</span>
        <span class="font-medium text-text">{{ m.equipement_nom }}</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-text-secondary">Signalée par</span>
        <span class="font-medium text-text">{{ m.signale_par_nom ?? '—' }}</span>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-text mb-2">
        Date d'intervention prévue <span class="text-danger">*</span>
      </label>
      <p-datepicker [(ngModel)]="datePlanifiee" dateFormat="dd/mm/yy" placeholder="jj/mm/aaaa"
        [showIcon]="true" [showTime]="true" [minDate]="today" class="w-full" inputStyleClass="w-full" />
    </div>
  }

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-3">
      <p-button label="Annuler" severity="secondary" [outlined]="true" [disabled]="submitting()" (onClick)="onAnnuler()" />
      <p-button label="Prendre en charge" icon="pi pi-check" [loading]="submitting()" (onClick)="onConfirmer()" />
    </div>
  </ng-template>
</p-dialog>
