<div class="mb-6 sm:mb-8 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
  <div class="min-w-0">
    @if (breadcrumbs().length) {
      <div class="mb-3 flex flex-wrap items-center gap-2 text-sm text-text-secondary">
        @for (crumb of breadcrumbs(); track $index; let last = $last) {
          @if (crumb.link && !last) {
            <a [routerLink]="resoudreLien(crumb.link)" class="hover:text-primary transition-colors">{{ crumb.label }}</a>
            <i class="pi pi-angle-right text-xs"></i>
          } @else {
            <span class="text-primary font-medium">{{ crumb.label }}</span>
          }
        }
      </div>
    }
    <div class="flex flex-wrap items-center gap-3">
      <h1 class="break-words text-xl sm:text-2xl font-semibold text-text">{{ title() }}</h1>
      <ng-content select="[badge]" />
    </div>
    @if (subtitle()) {
      <p class="mt-1 text-sm text-text-secondary">{{ subtitle() }}</p>
    }
  </div>

  <ng-content select="[actions]" />
</div>
