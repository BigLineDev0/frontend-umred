<div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
  <div>
    @if (breadcrumbs().length) {
      <div class="mb-3 flex items-center gap-2 text-sm text-text-secondary">
        @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
          @if (crumb.link && !last) {
            <a [routerLink]="crumb.link" class="hover:text-primary transition-colors">{{ crumb.label }}</a>
            <i class="pi pi-angle-right text-xs"></i>
          } @else {
            <span class="text-primary font-medium">{{ crumb.label }}</span>
          }
        }
      </div>
    }
    <h1 class="text-2xl font-semibold text-text">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="mt-1 text-sm text-text-secondary">{{ subtitle() }}</p>
    }
  </div>

  <ng-content select="[actions]" />
</div>
