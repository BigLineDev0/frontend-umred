<div class="bg-white border border-border rounded-xl p-4 sm:p-5">
  <div class="flex items-start justify-between gap-2">
    <span class="text-xs sm:text-sm leading-snug text-text-secondary">{{ label() }}</span>
    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg flex items-center justify-center shrink-0"
         [class.bg-primary/10]="color() === 'primary'"
         [class.bg-success/10]="color() === 'success'"
         [class.bg-danger/10]="color() === 'danger'"
         [class.bg-accent/10]="color() === 'accent'">
      <i [class]="icon()"
         [class.text-primary]="color() === 'primary'"
         [class.text-success]="color() === 'success'"
         [class.text-danger]="color() === 'danger'"
         [class.text-accent]="color() === 'accent'"></i>
    </div>
  </div>
  <p class="mt-1 text-2xl sm:text-3xl font-bold text-text">
    @if (numericValue(); as n) { <app-animated-number [value]="n" /> } @else { {{ value() }} }
  </p>
</div>
